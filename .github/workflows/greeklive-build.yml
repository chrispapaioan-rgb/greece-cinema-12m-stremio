name: GreekLive Android build

on:
  push:
    branches: [main]
    paths:
      - 'greeklive-build/**'
      - '.github/workflows/greeklive-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build helper
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Clone LiveTranslate upstream
        run: git clone --depth 1 https://github.com/xieyuanqing/vtuber-live-translate.git upstream

      - name: Apply GreekLive v0.1.10 patch
        run: python3 greeklive-build/patch.py upstream

      - name: Build and lint
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Package APK
        run: |
          cp upstream/android/app/build/outputs/apk/debug/app-debug.apk GreekLive-v0.1.10.apk
          unzip -t GreekLive-v0.1.10.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging GreekLive-v0.1.10.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GreekLive-v0.1.10.apk | tee apk-signature.txt
          grep -q "package: name='com.greeklive.subtitles'" apk-badging.txt
          grep -q "versionCode='10011'" apk-badging.txt
          grep -q "versionName='0.1.10'" apk-badging.txt
          sha256sum GreekLive-v0.1.10.apk | tee SHA256SUMS.txt

      - name: Upload GreekLive APK
        uses: actions/upload-artifact@v4
        with:
          name: GreekLive-v0.1.10
          path: |
            GreekLive-v0.1.10.apk
            SHA256SUMS.txt
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 7
