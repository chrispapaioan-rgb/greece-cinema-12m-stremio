name: GreekLive v0.1.10 Google TV build

on:
  push:
    branches: [greeklive-v010-acoustic]
    paths:
      - 'greeklive-build/**'
      - '.github/workflows/greeklive-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PINNED_UPSTREAM: 0c9ba335be827d27f87b3781180175b85cc62bd4
    steps:
      - name: Checkout build helper
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Clone pinned LiveTranslate source
        run: |
          git clone https://github.com/xieyuanqing/vtuber-live-translate.git upstream
          git -C upstream checkout --detach "$PINNED_UPSTREAM"
          test "$(git -C upstream rev-parse HEAD)" = "$PINNED_UPSTREAM"

      - name: Recreate POCO-tested GreekLive v0.1.10 baseline
        run: python3 greeklive-build/patch.py upstream

      - name: Assemble and apply acoustic speaker patch
        run: |
          cat greeklive-build/acoustic-parts/part-* > greeklive-build/acoustic_patch.py
          python3 -m py_compile greeklive-build/acoustic_patch.py
          python3 greeklive-build/acoustic_patch.py upstream
          # Upgrade cleanly over the already-tested v0.1.10 package.
          sed -i 's/versionCode = 10011/versionCode = 10023/' upstream/android/app/build.gradle.kts

      - name: Download and pin sherpa + speaker models
        run: |
          mkdir -p upstream/android/app/libs upstream/android/app/src/main/assets
          curl -fL --retry 4 --retry-delay 2             https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar             -o upstream/android/app/libs/sherpa-onnx-1.13.8.aar
          curl -fL --retry 4 --retry-delay 2             https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx             -o upstream/android/app/src/main/assets/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          curl -fL --retry 4 --retry-delay 2             https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx             -o upstream/android/app/src/main/assets/silero_vad.onnx
          cd upstream/android/app
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          echo "1a331345f04805badbb495c775a6ddffcdd1a732567d5ec8b3d5749e3c7a5e4b  src/main/assets/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx" | sha256sum -c -
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  src/main/assets/silero_vad.onnx" | sha256sum -c -

      - name: Compile and run GreekLive acoustic unit tests
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests com.xyq.livetranslate.AcousticSpeakerTurnTest \
            --tests com.xyq.livetranslate.ui.SessionCoordinatorProjectionRepeatTest \
            --tests com.xyq.livetranslate.SubtitleOverlayBottomPlacementTest \
            --tests com.xyq.livetranslate.SubtitleLayoutAndSpacingTest \
            --stacktrace

      - name: Lint and assemble APK
        working-directory: upstream/android
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug --stacktrace

      - name: APK preflight
        run: |
          cp upstream/android/app/build/outputs/apk/debug/app-debug.apk GreekLive-v0.1.10-TV.apk
          unzip -t GreekLive-v0.1.10-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging GreekLive-v0.1.10-TV.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GreekLive-v0.1.10-TV.apk | tee apk-signature.txt
          grep -q "package: name='com.greeklive.subtitles'" apk-badging.txt
          grep -q "versionCode='10023'" apk-badging.txt
          grep -q "versionName='0.1.10'" apk-badging.txt
          grep -q "leanback-launchable-activity:" apk-badging.txt
          grep -q "uses-feature-not-required: name='android.hardware.touchscreen'" apk-badging.txt
          grep -q "uses-feature-not-required: name='android.hardware.microphone'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree GreekLive-v0.1.10-TV.apk --file AndroidManifest.xml | tee apk-manifest.txt
          ! grep -q "ProjectionConsentActivity" apk-manifest.txt
          unzip -l GreekLive-v0.1.10-TV.apk | tee apk-files.txt
          grep -q "assets/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx" apk-files.txt
          grep -q "assets/silero_vad.onnx" apk-files.txt
          grep -q "lib/arm64-v8a/" apk-files.txt
          sha256sum GreekLive-v0.1.10-TV.apk | tee SHA256SUMS.txt

      - name: Upload Google TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: GreekLive-v0.1.10-google-tv-test
          path: |
            GreekLive-v0.1.10-TV.apk
            SHA256SUMS.txt
            apk-badging.txt
            apk-signature.txt
            apk-files.txt
            apk-manifest.txt
          if-no-files-found: error
          retention-days: 7
