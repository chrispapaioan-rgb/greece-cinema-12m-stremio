name: Update hidden adultItems catalog
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh adultItems
        run: node tools/update-adult-items.mjs
      - name: Validate adultItems rules
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/adult-items.json','utf8'));
          if (!Array.isArray(x.items) || x.items.length===0) throw new Error('adultItems empty');
          const bad=x.items.filter(m => Number.isFinite(m.score) && m.score <= 50);
          if (bad.length) throw new Error('Found Film Index scores <=50 in adultItems');
          if (x.startYear !== 1980) throw new Error('adultItems automatic scan must start at 1980');
          const illegalOld=x.items.filter(m => Number(m.year) < 1980 && !(m.adultClassicException===true && m.adultAdmission==='CLASSIC 18+' && String(m.classicReason||'').trim()));
          if (illegalOld.length) throw new Error('Pre-1980 adult item without documented CLASSIC 18+ exception');
          if (x.items.some(m => m.adultCategory!=='ADULT_ART' || m.adultExclusive!==true)) throw new Error('adult flags missing');
          console.log('adultItems',x.items.length,'scored',x.items.filter(m=>m.score!=null).length,'unrated',x.items.filter(m=>m.score==null).length);
          NODE
      - name: Publish refreshed adultItems
        run: |
          git config user.name 'cine75-adult-catalog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add data/adult-items.json
          if git diff --cached --quiet; then
            echo 'adultItems unchanged.'
            exit 0
          fi
          git commit -m 'data: refresh hidden adultItems catalog'
          git push
