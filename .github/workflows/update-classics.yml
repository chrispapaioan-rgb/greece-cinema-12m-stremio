name: Update classics catalog
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh classics
        run: node tools/update-classics.mjs
      - name: Validate classics rules
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/classics-items.json','utf8'));
          if (!Array.isArray(x.items) || x.items.length===0) throw new Error('classics empty');
          if (x.items.some(m => Number(m.year)>=2016)) throw new Error('Classics must be pre-2016');
          if (x.items.some(m => m.classicCategory!=='CLASSICS')) throw new Error('classicCategory missing');
          const bad=x.items.filter(m => {
            const t=String(m.classicTier||'');
            if (t==='CLASSIC_MASTERPIECE_EXCEPTION') return false;
            return !Number.isFinite(Number(m.score)) || Number(m.score)<80;
          });
          if (bad.length) throw new Error('Automatic classic below score floor');
          console.log('classics',x.items.length,x.stats||{});
          NODE
      - name: Publish refreshed classics
        run: |
          git config user.name 'cine75-classics-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add data/classics-items.json
          if git diff --cached --quiet; then
            echo 'Classics unchanged.'
            exit 0
          fi
          git commit -m 'data: refresh classics catalog'
          git push
