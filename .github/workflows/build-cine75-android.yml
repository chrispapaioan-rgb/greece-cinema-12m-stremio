name: Build Cine75 universal APK
on:
  push:
    branches: [main, android-universal]
    paths:
      - 'ci/cine75-code.tar.gz.b64'
      - '.github/workflows/build-cine75-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source and offline seed
        run: |
          rm -rf android-universal
          mkdir -p android-universal
          base64 -d ci/cine75-code.tar.gz.b64 | tar -xzf - -C android-universal
          mkdir -p android-universal/app/src/main/assets
          cp data/cine75-app-catalog.b64 android-universal/app/src/main/assets/movies_seed.b64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android API 35 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable universal APK
        run: gradle -p android-universal :app:assembleDebug --stacktrace --no-daemon
      - name: Verify package metadata
        run: |
          APK=android-universal/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/cine75-badging.txt
          grep -q "package: name='gr.cine75.app'" /tmp/cine75-badging.txt
          grep -q "versionName='1.0.6'" /tmp/cine75-badging.txt
          grep -q "leanback" /tmp/cine75-badging.txt
          grep -q "com.phlox.tvwebbrowser" android-universal/app/src/main/java/gr/cine75/app/DetailActivity.java
          grep -q "private static String str" android-universal/app/src/main/java/gr/cine75/app/Movie.java\n          grep -q "TARGET_W = 480" android-universal/app/src/main/java/gr/cine75/app/ImageLoader.java
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-universal/app/build/outputs/apk/debug/app-debug.apk dist/Cine75-universal.apk
          sha256sum dist/Cine75-universal.apk | tee dist/Cine75-universal.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Cine75-universal-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK for device lab
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'cine75-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          base64 -w 0 dist/Cine75-universal.apk > ci/Cine75-universal.apk.b64
          cp dist/Cine75-universal.apk.sha256 ci/Cine75-universal.apk.sha256
          git add ci/Cine75-universal.apk.b64 ci/Cine75-universal.apk.sha256
          if git diff --cached --quiet; then
            echo 'Published APK unchanged.'
            exit 0
          fi
          git commit -m 'chore: publish Cine75 v1.0.6 device-test APK'
          git push
