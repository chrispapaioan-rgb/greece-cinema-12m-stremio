name: Build Cine75 Universal APK
on:
  push:
    branches: [android-universal]
    paths:
      - 'android-universal/**'
      - '.github/workflows/cine75-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable universal debug APK
        run: gradle -p android-universal :app:assembleDebug --stacktrace
      - name: Package
        run: |
          cp android-universal/app/build/outputs/apk/debug/app-debug.apk Cine75-universal-v1.0.1.apk
          sha256sum Cine75-universal-v1.0.1.apk > Cine75-universal-v1.0.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Cine75-universal-v1.0.1
          path: |
            Cine75-universal-v1.0.1.apk
            Cine75-universal-v1.0.1.apk.sha256
          retention-days: 30
