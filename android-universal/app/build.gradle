plugins { id 'com.android.application' }

android {
    namespace 'gr.cine75.app'
    compileSdk 35
    defaultConfig {
        applicationId 'gr.cine75.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }
    buildTypes {
        release { minifyEnabled false }
